<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Solid accent tile (the accent colour from styles.css) rather than a bare
       glyph, so the mark stays legible against both light and dark browser
       chrome. NB: XML comments must not contain a double hyphen, so CSS custom
       property names cannot be written literally here. -->
  <rect width="32" height="32" rx="7" fill="#4361ee"/>
  <!-- Pulse trace. Stroke is heavy for its size on purpose: at a 16px tab
       favicon a thinner line greys out into an unreadable smudge. -->
  <path d="M4 16.5h6.2l2.6-7.4 4.4 13.8 2.8-6.4H28"
        fill="none" stroke="#fff" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
