name: publish-image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

# main-push and tag-push are different refs and can run concurrently, since the
# group below keys on github.ref. That is only safe because they write disjoint
# tag sets — see the `enable={{is_default_branch}}` on the sha rule below, which
# is what actually makes it true. Without it both refs emit sha-<short> for the
# release commit and the later run silently repoints it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # No `type=raw,value=latest,enable={{is_default_branch}}` rule here.
          # metadata-action's default `flavor: latest=auto` already applies
          # latest to non-prerelease semver tags. Adding the raw rule too makes
          # latest land on BOTH paths, so it bounces between "tip of main" and
          # "newest release" depending on which workflow ran last.
          #
          # sha- is restricted to main. A release commit is reached twice — as a
          # push to main and as the vX.Y.Z tag — and type=sha has no ref
          # restriction by default, so both runs would emit sha-<short> for the
          # same commit. They race, and since Docker builds are not
          # byte-reproducible, whichever finishes last repoints sha-<short> at a
          # different digest. That makes the one tag meant to identify an exact
          # build the one tag you cannot trust. Restricting it to main makes it
          # single-writer and deterministic.
          #
          # This removes the race, not the second build: the release commit is
          # still built once per ref, so sha-<short> and X.Y.Z remain distinct
          # digests of identical source. Verify a release by comparing the three
          # version tags to each other, not to sha-<short>.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
