name: publish-image

# Tags only. NEVER add `branches: [main]` here.
#
# A release commit is reached twice — as a push to main and as the vX.Y.Z tag —
# so triggering on both builds the same source twice, and both runs write
# sha-<short>. They cannot cancel each other (the concurrency group keys on
# github.ref), so they race, and since Docker builds are not byte-reproducible
# whichever lands last silently repoints sha-<short> at a different digest.
# That makes the one tag meant to identify an exact build the one tag you
# cannot trust.
#
# Tag-only means a single run writes every tag from a single build, so
# X.Y.Z / X.Y / latest / sha-<short> all share one digest and sha- genuinely
# IS the release. Verify a release by checking all four agree.
#
# The cost is no image for commits that are never released. That is acceptable
# here: release_commits in release-plz.toml limits unreleased commits to
# docs/ci/chore, which nobody deploys, and auto-merge keeps the merge-to-release
# window to a few minutes.
#
# The test gate is NOT lost by dropping the main trigger: release-plz.yml still
# fires on main and `needs:` the same reusable test.yml, so a red main still
# blocks both the release and the image.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # No `type=raw,value=latest,enable={{is_default_branch}}` rule here.
          # metadata-action's default `flavor: latest=auto` already applies
          # latest to non-prerelease semver tags. Adding the raw rule too makes
          # latest land on BOTH paths, so it bounces between "tip of main" and
          # "newest release" depending on which workflow ran last.
          #
          # sha- is deliberately NOT restricted by ref. Under the tag-only
          # trigger above there is exactly one run per release, so all four tags
          # come from one build and share one digest — which is the point:
          # sha-<short> identifies the released artifact rather than a separate
          # build of the same source. An `enable={{is_default_branch}}` here
          # would suppress it on the tag path and leave releases with no sha-
          # tag at all.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
