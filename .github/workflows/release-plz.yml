name: release-plz

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Serialize runs so a post-merge run cannot race the run that spawned it.
# cancel-in-progress MUST be false — cancelling mid-release can interrupt tag
# creation.
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate releases on the same suite publish-image runs, so a red main cannot
  # tag/release. Without this, release-plz gated on nothing and a failing main
  # still cut a tag + GitHub Release with no image behind it.
  test:
    uses: ./.github/workflows/test.yml

  release-plz:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # release-plz needs full history
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      # `release` FIRST. On a post-merge run it tags the just-merged version, so
      # release-pr below then sees a fully-released main and opens nothing.
      # Running release-pr first is what produced duplicate PRs and red runs.
      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          # NOT secrets.GITHUB_TOKEN: tags pushed with it do not trigger
          # publish-image.yml, so the release would silently produce no image.
          GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}

      - id: release_pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}

      # Deliberately has NO `if:`. Gating this on
      # `steps.release_pr.outputs.prs_created == 'true'` is a silent-stop bug:
      # once a merge fails for any reason, every later push UPDATES the existing
      # PR rather than creating one, so prs_created is false forever and this
      # step never runs again. The symptom is green runs with an open release PR
      # and no tag, which requires a hand-merge to escape. Running
      # unconditionally makes the step idempotent — it merges whatever release
      # PR is open, or exits cleanly when there is none.
      - name: Auto-merge the release PR
        env:
          # Must be RELEASE_BOT_TOKEN: a merge by GITHUB_TOKEN does not trigger
          # the follow-up run that cuts the tag.
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          # The title filter is load-bearing: `.[0].number` alone would grab
          # whatever PR happens to be first, so an unrelated open PR would get
          # squash-merged by a workflow meant only for releases. The pattern
          # covers both bots' formats (release-plz `chore: release vX.Y.Z`,
          # release-please `chore(main): release X.Y.Z`). `// empty` yields an
          # empty string rather than the literal `null` when nothing matches.
          pr=$(gh pr list --repo "${{ github.repository }}" --state open --json number,title \
                --jq 'map(select(.title | test("^chore(\\(.+\\))?: release "))) | .[0].number // empty')
          if [ -z "$pr" ]; then echo "no open release PR"; exit 0; fi
          gh pr merge --squash --delete-branch --repo "${{ github.repository }}" "$pr"
