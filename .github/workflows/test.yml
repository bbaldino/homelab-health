name: test

# Reusable gate. Both publish-image.yml and release-plz.yml `uses:` this so
# a red main blocks both — no image AND no release PR. Ownership lives here
# so the two callers can't drift.
on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly fmt --check
      - run: cargo +stable clippy --all-targets --all-features -- -D warnings
      - run: cargo +stable test --locked
