[workspace]
# This is an application shipped as a container image, not a library.
# Never publish to crates.io.
publish = false

# This crate is never published to any registry, so derive the last-released
# version from git tags instead of crates.io. Without this, release-plz treats
# every run as the crate's first release and never bumps past the current
# Cargo.toml version. (git_only runs `cargo package --verify`, which is why
# ui/dist must exist in the source tree — see ui/dist/.gitkeep.)
git_only = true

# Cut a GitHub release alongside the tag so the changelog is visible there.
git_release_enable = true

# The tag format publish-image.yml matches on: v*.*.*
git_tag_name = "v{{version}}"

# Only feat/fix cut a release. Without this, release-plz bumps on ANY
# conventional commit — docs/ci/chore all cut versions and rebuild the image.
# The character class also catches `feat(scope):` and `feat!:`.
# (NB: this is release_commits, not commit_parsers — the latter is a changelog
# field with no effect on whether a release happens.)
release_commits = "^(feat|fix)[(!:]"
